services:
  postgres:
    image: postgres:16-alpine
    container_name: sales_pipeline_pg
    environment:
      POSTGRES_DB: pipeline_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
